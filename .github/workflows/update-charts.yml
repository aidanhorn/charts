name: Update charts

on:
  schedule:
    - cron: "15 6 * * *"  # daily, 06:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'pak::pkg_install(c("httr2", "jsonlite", "ggplot2"))'

      - name: Update crypto (BTC) chart
        run: Rscript scripts/crypto_btc.R

      - name: Commit updated chart(s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "Auto-update charts"
          git push
