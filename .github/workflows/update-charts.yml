name: Update charts

on:
  schedule:
    - cron: "15 6 * * *"    # daily - crypto, climate (air quality), oil
    - cron: "20 6 1 * *"    # monthly (1st) - slower-cadence pillars (energy, real estate, copper)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("httr2", "jsonlite", "ggplot2", "maps", "readxl"))'

      - name: Update crypto (BTC) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/crypto_btc.R

      - name: Update crypto (ETH) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/crypto_eth.R

      - name: Update crypto (SOL) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/crypto_sol.R

      - name: Update crypto (XRP) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/crypto_xrp.R

      - name: Update crypto (LTC) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/crypto_ltc.R

      - name: Update climate (air quality) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: Rscript scripts/climate_air_quality.R

      - name: Update commodities (oil) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_oil.R

      - name: Update commodities (natural gas) chart
        if: github.event.schedule == '15 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_natgas.R

      - name: Update energy (generation mix) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/energy_generation_mix.R

      - name: Update energy (generation mix stacked) charts
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/energy_generation_stacked.R

      - name: Update real estate (house prices) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/real_estate_house_prices.R

      - name: Update commodities (copper) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_copper.R

      - name: Update commodities (wheat) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_wheat.R

      - name: Update commodities (corn) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_corn.R

      - name: Update commodities (soybeans) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_soybeans.R

      - name: Update commodities (aluminum) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_aluminum.R

      - name: Update commodities (cocoa) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_cocoa.R

      - name: Update commodities (cotton) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_cotton.R

      - name: Update commodities (coffee) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_coffee.R

      - name: Update commodities (sugar) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_sugar.R

      - name: Update commodities (nickel) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_nickel.R

      - name: Update commodities (zinc) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: Rscript scripts/commodities_zinc.R

      - name: Update commodities (gold) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/commodities_gold.R

      - name: Update commodities (silver) chart
        if: github.event.schedule == '20 6 1 * *' || github.event_name == 'workflow_dispatch'
        run: Rscript scripts/commodities_silver.R

      - name: Commit updated chart(s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "Auto-update charts"
          git push
